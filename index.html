<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Financeiro</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Financeiro">
<meta name="theme-color" content="#26365a">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#f5f2ea; --card:#ffffff; --navy:#26365a; --navy2:#26324a;
  --amber:#b9812e; --green:#2f6a4d; --red:#a84a3a; --muted:#6b7280;
  --border:#e7e2d6; --text:#22283a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --cream:#15181f; --card:#1e222c; --border:#2b303c; --text:#eceef2; --muted:#9aa0ac;
  }
}
:root[data-theme="dark"]{
  --cream:#15181f; --card:#1e222c; --border:#2b303c; --text:#eceef2; --muted:#9aa0ac;
}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
*{box-sizing:border-box;}
body{
  margin:0; height:100%; background:var(--cream); color:var(--text);
  font-family:'Inter',system-ui,-apple-system,sans-serif; -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
h1,h2,.serif{font-family:'Playfair Display',Georgia,serif;}
#app{display:flex; flex-direction:column; height:100vh; max-width:520px; margin:0 auto; position:relative;}
header.top{
  background:linear-gradient(135deg,#1a2a4a 0%,#243a62 55%,#2c4676 100%);
  color:#f5f2ea; padding:20px 18px 24px;
  padding-top:calc(20px + env(safe-area-inset-top,0px));
  display:flex; justify-content:space-between; align-items:flex-start;
  position:relative; overflow:hidden;
}
header.top .htitle{display:flex; align-items:center; gap:10px;}
header.top .hic{width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,.14); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;}
header.top h1{margin:0; font-size:21px; font-weight:700;}
header.top .month{font-size:11.5px; color:#b9c2dd; margin-top:2px;}
select.msel, input.msel, button.msel{background:rgba(255,255,255,.14); color:#f5f2ea; border:1px solid rgba(255,255,255,.2); border-radius:20px; padding:7px 10px; font-size:11.5px; font-family:inherit; -webkit-appearance:none; appearance:none; color-scheme:dark;}
input.msel::-webkit-calendar-picker-indicator{filter:invert(1); opacity:.85;}
main{flex:1; overflow-y:auto; padding:16px 16px 150px; -webkit-overflow-scrolling:touch;}
.cards{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;}
.cards .wide{grid-column:1/3;}
.card{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:14px;}
.card.amber-grad{background:linear-gradient(135deg,#fdf3e0,#fbe8c6); border-color:#f3dba8;}
.card.green-grad{background:linear-gradient(135deg,#e5f6ea,#d5f0dd); border-color:#bfe4cb;}
.card.blue-grad{background:linear-gradient(135deg,#eaf1fb,#dde9f9); border-color:#c9dcf5;}
.card.red-grad{background:linear-gradient(135deg,#fbeae7,#f6d9d4); border-color:#eec3bc;}
:root[data-theme="dark"] .card.amber-grad{background:linear-gradient(135deg,#3a2f18,#332a15); border-color:#4a3c1e;}
:root[data-theme="dark"] .card.green-grad{background:linear-gradient(135deg,#173325,#132c20); border-color:#1f4531;}
:root[data-theme="dark"] .card.blue-grad{background:linear-gradient(135deg,#152238,#111c2e); border-color:#1e3252;}
:root[data-theme="dark"] .card.red-grad{background:linear-gradient(135deg,#3a2019,#331b15); border-color:#4a2a20;}
.card .cic{width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; margin-bottom:10px;}
.cic.amber{background:#e8a53d;} .cic.green{background:#2f9e5f;} .cic.blue{background:#4f7fe8;} .cic.red{background:#d9695a;}
.card .lbl{font-size:11.5px; color:var(--muted); margin-bottom:4px; font-weight:500;}
.card .val{font-size:19px; font-weight:700;}
.val.amber{color:#b9812e;} .val.green{color:#217a4b;} .val.muted{color:var(--text);} .val.red{color:#b3392a;}
.list{display:flex; flex-direction:column; gap:8px;}
.row{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:12px; display:flex; justify-content:space-between; align-items:center; gap:10px; cursor:pointer;}
.row .left{display:flex; align-items:center; gap:10px; min-width:0;}
.row .ric{width:38px; height:38px; border-radius:50%; background:#e9edf5; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;}
:root[data-theme="dark"] .row .ric{background:#2a3040;}
.row .info{min-width:0;}
.row .cli{font-weight:600; font-size:14px;}
.row .sub{font-size:11.5px; color:var(--muted); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.row .right{text-align:right; flex-shrink:0;}
.row .valor{font-weight:700; font-size:14px;}
.badge{display:inline-block; margin-top:4px; font-size:10.5px; padding:3px 8px; border-radius:20px; font-weight:600;}
.badge.pend{background:#f3e3c2; color:#8a6212;}
.badge.done{background:#dcecdf; color:#1f5c3a;}
:root[data-theme="dark"] .badge.pend, @media (prefers-color-scheme:dark){.badge.pend{background:#4a3a1c; color:#e8c887;}}
.delbtn{background:none; border:none; color:var(--muted); font-size:16px; padding:2px 4px; cursor:pointer;}
.fab{
  position:fixed; right:18px; bottom:calc(94px + env(safe-area-inset-bottom,0px));
  background:var(--navy); color:#fff; border:none; border-radius:30px; padding:11px 20px 11px 11px;
  font-family:inherit; font-weight:600; font-size:13.5px; box-shadow:0 8px 20px rgba(20,30,55,.35); cursor:pointer;
  max-width:480px; display:flex; align-items:center; gap:9px;
}
.fab .plus{width:26px; height:26px; border-radius:50%; background:rgba(255,255,255,.2); display:flex; align-items:center; justify-content:center; font-size:15px;}
.fabround{position:fixed; right:18px; bottom:calc(94px + env(safe-area-inset-bottom,0px)); width:52px; height:52px; border-radius:50%; background:var(--navy); color:#fff; border:none; font-size:24px; box-shadow:0 8px 20px rgba(20,30,55,.35); cursor:pointer; display:none; align-items:center; justify-content:center;}
nav.bottom{
  position:fixed; left:12px; right:12px; bottom:calc(10px + env(safe-area-inset-bottom,0px));
  max-width:496px; margin:0 auto; z-index:20;
  display:flex; gap:2px; padding:6px;
  background:var(--card); border:1px solid var(--border); border-radius:28px;
  box-shadow:0 12px 32px rgba(20,30,55,.18), 0 2px 6px rgba(20,30,55,.06);
}
nav.bottom button{
  flex:1; background:none; border:none; padding:5px 2px 4px; font-family:inherit; cursor:pointer;
  color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10.5px; font-weight:500;
  -webkit-tap-highlight-color:transparent; transition:color .2s;
}
nav.bottom .ic{width:46px; height:30px; border-radius:16px; display:flex; align-items:center; justify-content:center; transition:background .2s, transform .2s, box-shadow .2s;}
nav.bottom .ic svg{width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round;}
nav.bottom button:active .ic{transform:scale(.92);}
nav.bottom button.active{color:var(--navy); font-weight:700;}
nav.bottom button.active .ic{background:var(--navy); color:#fff; box-shadow:0 5px 12px rgba(27,39,64,.32);}
:root[data-theme="dark"] nav.bottom{box-shadow:0 12px 32px rgba(0,0,0,.5);}
:root[data-theme="dark"] nav.bottom button.active{color:#8fb3ff;}
:root[data-theme="dark"] nav.bottom button.active .ic{background:#8fb3ff; color:#15181f; box-shadow:0 5px 12px rgba(143,179,255,.25);}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) nav.bottom button.active{color:#8fb3ff;}
  :root:not([data-theme="light"]) nav.bottom button.active .ic{background:#8fb3ff; color:#15181f;}
}
table.gestao{width:100%; border-collapse:collapse; font-size:11.5px; background:var(--card); border-radius:12px; overflow:hidden; border:1px solid var(--border);}
table.gestao th{background:var(--navy); color:#f5f2ea; padding:8px 6px; font-weight:600; text-align:right; white-space:nowrap;}
table.gestao th:first-child, table.gestao td:first-child{text-align:left;}
table.gestao td{padding:7px 6px; text-align:right; border-top:1px solid var(--border); white-space:nowrap;}
.tablewrap{overflow-x:auto; border-radius:12px;}
.chart{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:16px;}
.chart .lbl{font-size:12.5px; font-weight:600; margin-bottom:10px;}
.legend{display:flex; gap:14px; font-size:11px; color:var(--muted); margin-top:8px;}
.legend span{display:inline-flex; align-items:center; gap:5px;}
.dot{width:9px; height:9px; border-radius:2px; display:inline-block;}
.modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.4); display:flex; align-items:flex-end; z-index:40;}
.modal{background:var(--card); width:100%; max-width:520px; margin:0 auto; border-radius:18px 18px 0 0; padding:18px; max-height:86vh; overflow-y:auto; padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));}
.modal h2{margin:0 0 14px; font-size:18px;}
.field{margin-bottom:12px;}
.field label{display:block; font-size:11.5px; color:var(--muted); margin-bottom:4px;}
.field input, .field select{width:100%; padding:10px; border-radius:9px; border:1px solid var(--border); background:var(--cream); color:var(--text); font-family:inherit; font-size:14px;}
.modalbtns{display:flex; gap:10px; margin-top:6px;}
.btn{flex:1; padding:12px; border-radius:10px; border:none; font-family:inherit; font-weight:600; font-size:14px; cursor:pointer;}
.btn.primary{background:var(--navy); color:#fff;}
.btn.ghost{background:var(--cream); color:var(--text); border:1px solid var(--border);}
.cards3{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:16px;}
.cards3 .wide{grid-column:1/4;}
.cards3 .card{padding:10px;}
.cards3 .cic{width:28px; height:28px; font-size:13px; margin-bottom:6px;}
.cards3 .lbl{font-size:9.5px;}
.cards3 .val{font-size:13.5px;}
.cards4{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:16px;}
.cards4 .card{padding:8px;}
.cards4 .cic{width:24px; height:24px; font-size:11px; margin-bottom:5px;}
.cards4 .lbl{font-size:8px; line-height:1.2;}
.cards4 .val{font-size:11px;}
.cardsD{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:16px;}
.cardsD .wide{grid-column:1/4;}
.cardsD .card{padding:12px;}
.cardsD .cic{width:36px; height:36px; font-size:16px; margin-bottom:8px;}
.cardsD .lbl{font-size:10.5px;}
.cardsD .val{font-size:15.5px;}
.catbox{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:14px;}
.catbox .cthead{display:flex; align-items:center; gap:10px; font-weight:700; font-size:15px; margin-bottom:14px;}
.catwrap{display:flex; gap:16px; align-items:center;}
.donut{width:126px; height:126px; border-radius:50%; position:relative; flex-shrink:0;}
.donut .dctr{position:absolute; inset:22%; background:var(--card); border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;}
.donut .dctr b{font-size:11.5px; color:var(--text);} .donut .dctr span{font-size:9px; color:var(--muted);}
.catlegend{flex:1; display:flex; flex-direction:column; gap:10px; min-width:0;}
.catlegend .cl-row{display:flex; align-items:center; gap:7px; font-size:12px;}
.catlegend .dot2{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
.catlegend .cl-name{font-weight:600; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.catlegend .cl-val{font-weight:600; font-size:11px; white-space:nowrap;}
.catlegend .cl-pct{color:var(--muted); font-size:10.5px; width:30px; text-align:right;}
.sectionh{font-size:15px; font-weight:700; margin:4px 0 10px;}
.swatchgrid{display:flex; flex-wrap:wrap; gap:10px;}
.swatch{width:32px; height:32px; border-radius:50%; cursor:pointer; border:3px solid transparent; box-sizing:border-box;}
.swatch.sel{border-color:var(--text); transform:scale(1.12);}
.formscreen{position:fixed; inset:0; background:var(--cream); z-index:30; display:flex; flex-direction:column;}
.formscreen main{flex:1; overflow-y:auto; padding:24px 18px 110px; -webkit-overflow-scrolling:touch;}
.ffield{display:flex; gap:14px; align-items:flex-start; margin-bottom:22px;}
.ffield .fic{width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;}
.fic.blue{background:#dbeafe;} .fic.green{background:#d7f4e0;} .fic.purple{background:#e6ddfa;} .fic.orange{background:#ffe3cf;} .fic.teal{background:#d5eef2;}
.ffield .fbody{flex:1; min-width:0;}
.ffield label{display:block; font-weight:700; font-size:14px; margin-bottom:8px; color:var(--text);}
.ffield input, .ffield select{width:100%; padding:14px; border-radius:12px; border:1px solid var(--border); background:var(--card); font-family:inherit; font-size:14px; color:var(--text);}
.formbtns{position:fixed; left:0; right:0; bottom:0; display:flex; gap:12px; padding:14px 18px; padding-bottom:calc(14px + env(safe-area-inset-bottom,0px)); background:var(--cream); border-top:1px solid var(--border); max-width:520px; margin:0 auto;}
.formbtns .btn{flex:1; padding:14px; border-radius:12px; font-weight:700; font-size:14.5px; display:flex; align-items:center; justify-content:center; gap:8px; font-family:inherit; cursor:pointer;}
.formbtns .btn.cancel{background:#e7ebf3; color:var(--navy); border:none;}
:root[data-theme="dark"] .formbtns .btn.cancel{background:#262c3a; color:#e5e9f2;}
.formbtns .btn.save{background:var(--navy); color:#fff; border:none;}
.backbtn{background:none; border:none; color:#fff; font-size:20px; cursor:pointer; padding:0; margin-right:2px;}
.empty{text-align:center; padding:36px 16px; background:var(--card); border:1px solid var(--border); border-radius:16px;}
.empty .eic{font-size:34px; margin-bottom:10px;}
.empty .et{font-weight:700; font-size:14.5px; margin-bottom:4px;}
.empty .es{color:var(--muted); font-size:12.5px; line-height:1.5;}
.motiv{background:linear-gradient(135deg,#e6f7ec,#d9f2e2); border:1px solid #bfe4cb; border-radius:16px; padding:14px 16px; display:flex; gap:12px; align-items:center; margin-top:14px;}
.motiv .mic{font-size:24px;}
.motiv b{display:block; font-size:14px; color:#1f5c3a;}
.motiv span{font-size:12px; color:#2b6b46;}
:root[data-theme="dark"] .motiv{background:linear-gradient(135deg,#173325,#132c20); border-color:#1f4531;}
:root[data-theme="dark"] .motiv b{color:#7fd9a0;} :root[data-theme="dark"] .motiv span{color:#9adcb4;}
.gest-btn{width:100%; display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; font-family:inherit; cursor:pointer; margin-bottom:14px;}
.gest-btn .gic{width:34px; height:34px; border-radius:50%; background:#e9edf5; display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0;}
.gest-btn .gtxt{flex:1; text-align:left; font-weight:600; font-size:13.5px; color:var(--text);}
.gest-btn .chev{color:var(--muted); font-size:18px;}
:root[data-theme="dark"] .gest-btn .gic{background:#2a3040;}
.toast{position:fixed; left:50%; bottom:calc(106px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%) translateY(10px); background:rgba(20,26,40,.92); color:#fff; padding:10px 16px; border-radius:22px; font-size:12.5px; opacity:0; pointer-events:none; transition:.2s; z-index:60; max-width:80%; text-align:center;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
.ex-hero{background:linear-gradient(135deg,#1a2a4a 0%,#243a62 55%,#34508a 100%); color:#f5f2ea; border-radius:20px; padding:18px; margin-bottom:14px; position:relative; overflow:hidden; box-shadow:0 10px 24px rgba(20,30,55,.25);}
.ex-hero::after{content:''; position:absolute; right:-30px; top:-30px; width:120px; height:120px; border-radius:50%; background:rgba(255,255,255,.07);}
.ex-hero .eh-top{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.ex-hero .eh-ic{width:34px; height:34px; border-radius:12px; background:rgba(255,255,255,.16); display:flex; align-items:center; justify-content:center;}
.ex-hero .eh-lbl{font-size:12px; color:#b9c2dd; font-weight:500;}
.ex-hero .eh-per{font-size:10.5px; color:#8fa0c8;}
.ex-hero .eh-val{font-family:'Playfair Display',Georgia,serif; font-size:30px; font-weight:700; letter-spacing:-.5px; margin-bottom:14px;}
.ex-hero .eh-stats{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
.ex-hero .eh-st{background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.12); border-radius:14px; padding:10px 12px;}
.ex-hero .eh-st small{display:flex; align-items:center; gap:6px; font-size:10.5px; color:#b9c2dd; margin-bottom:3px;}
.ex-hero .eh-st b{font-size:14px;}
.ex-hero .up{color:#6fe0a0;} .ex-hero .down{color:#ff9d8f;}
.ex-btnsaida{width:100%; background:linear-gradient(135deg,#e07a6b,#c9564a); color:#fff; border:none; border-radius:16px; padding:15px; font-weight:700; font-size:14px; display:flex; align-items:center; justify-content:center; gap:8px; font-family:inherit; cursor:pointer; margin-bottom:18px; box-shadow:0 8px 18px rgba(201,86,74,.3);}
.ex-row{display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--border); border-radius:18px; padding:12px 14px; margin-bottom:10px; position:relative; overflow:hidden; box-shadow:0 2px 8px rgba(20,30,55,.05);}
.ex-row::before{content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--ac);}
.ex-row .ex-ic{width:42px; height:42px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:700; flex-shrink:0; background:var(--acbg); color:var(--ac);}
.ex-row .ex-info{flex:1; min-width:0;}
.ex-row .ex-t{font-weight:600; font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.ex-row .ex-s{font-size:11px; color:var(--muted); margin-top:3px;}
.ex-row .ex-v{font-weight:700; font-size:14px; text-align:right; white-space:nowrap; color:var(--ac);}
.ex-row .ex-tag{display:inline-block; margin-top:4px; font-size:9.5px; font-weight:600; padding:2px 8px; border-radius:20px; background:var(--acbg); color:var(--ac);}
.ex-filtro{display:flex; gap:8px; margin-bottom:14px;}
.ex-filtro .ex-ano{flex:1; border:1px solid var(--border); border-radius:14px; padding:8px; background:var(--card); display:flex; align-items:center; justify-content:space-between;}
.ex-filtro .ex-ano button{background:none; border:none; font-size:16px; color:var(--text); cursor:pointer;}
.ex-filtro select{flex:1; border:1px solid var(--border); border-radius:14px; padding:8px 10px; background:var(--card); color:var(--text); font-family:inherit; font-size:12.5px; font-weight:600;}
.ex-mesbtn{flex:1; border:1px solid var(--border); border-radius:14px; padding:8px 12px; background:var(--card); color:var(--text); font-family:inherit; font-size:12.5px; font-weight:600; display:flex; align-items:center; justify-content:space-between; gap:6px; cursor:pointer; white-space:nowrap; overflow:hidden;}
.ex-mgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px;}
.ex-mchip{padding:12px 4px; border-radius:12px; border:1px solid var(--border); background:var(--cream); color:var(--text); font-family:inherit; font-size:13px; font-weight:600; cursor:pointer;}
.ex-mchip.on{background:var(--navy); color:#fff; border-color:var(--navy);}
.ex-mchip:disabled{opacity:.35; cursor:not-allowed;}
:root[data-theme="dark"] .ex-mchip.on{background:#8fb3ff; color:#15181f; border-color:#8fb3ff;}
.i{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; display:block;}
header.hmain{flex-direction:column; align-items:stretch; gap:14px; padding-bottom:18px; border-radius:0 0 28px 28px; box-shadow:0 10px 26px rgba(15,27,51,.25);}
header.hmain::before{content:''; position:absolute; right:-50px; top:-60px; width:190px; height:190px; border-radius:50%; background:rgba(255,255,255,.05);}
header.hmain>*{position:relative; z-index:1;}
.hrow{display:flex; align-items:center; justify-content:space-between; gap:10px;}
header.hmain .hic{width:44px; height:44px; border-radius:15px; color:#fff; box-shadow:0 6px 14px rgba(0,0,0,.28);}
header.hmain h1{font-size:22px; line-height:1.15;}
.gearbtn{width:40px; height:40px; border-radius:14px; border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.12); color:#f5f2ea; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; flex-shrink:0;}
.hbar{display:flex; align-items:center; gap:4px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.16); border-radius:18px; padding:4px;}
.hnav{width:36px; height:36px; border-radius:14px; border:none; background:rgba(255,255,255,.1); color:#fff; font-size:18px; cursor:pointer; flex-shrink:0; font-family:inherit;}
.hbar .hlabel{flex:1; background:transparent; border:none; text-align:center; font-size:13.5px; font-weight:600; padding:8px 6px; border-radius:12px; min-width:0;}
.hero{position:relative; overflow:hidden; border-radius:22px; padding:18px; margin-bottom:16px; color:#fff; background:linear-gradient(135deg,#1a2a4a,#243a62 55%,#34508a); box-shadow:0 12px 26px rgba(20,30,55,.22);}
.hero.green{background:linear-gradient(135deg,#0d3b2c,#176a49 60%,#2a9266);}
.hero.red{background:linear-gradient(135deg,#4a1a18,#9a3a31 60%,#d0594b);}
.hero.blue{background:linear-gradient(135deg,#112a63,#1f4fb5 60%,#3b7cf0);}
.hero::before{content:''; position:absolute; right:-40px; top:-40px; width:150px; height:150px; border-radius:50%; background:rgba(255,255,255,.08);}
.hero::after{content:''; position:absolute; right:30px; bottom:-60px; width:120px; height:120px; border-radius:50%; background:rgba(255,255,255,.05);}
.hero>*{position:relative; z-index:1;}
.hero-top{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
.hero-ic{width:38px; height:38px; border-radius:13px; background:rgba(255,255,255,.18); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.hero-lbl{font-size:12.5px; font-weight:600; opacity:.92;}
.hero-per{font-size:11px; opacity:.7; margin-top:1px;}
.hero-chip{margin-left:auto; font-size:10.5px; font-weight:700; padding:5px 10px; border-radius:20px; background:rgba(255,255,255,.18); white-space:nowrap;}
.hero-val{font-family:'Playfair Display',Georgia,serif; font-size:31px; font-weight:700; letter-spacing:-.5px; margin-bottom:14px; white-space:nowrap;}
.hero-bar{height:7px; border-radius:7px; background:rgba(255,255,255,.2); margin:-4px 0 14px; overflow:hidden;}
.hero-bar i{display:block; height:100%; border-radius:7px; background:#fff;}
.hero-stats{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
.hero-stats.three{grid-template-columns:repeat(3,1fr);}
.hero-st{background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.14); border-radius:14px; padding:9px 10px; min-width:0;}
.hero-st small{display:block; font-size:10px; opacity:.75; margin-bottom:3px; white-space:nowrap;}
.hero-st b{display:block; font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.hero-stats.three .hero-st b{font-size:11.5px;}
.yearpill{display:flex; align-items:center; justify-content:space-between; width:170px; margin:0 auto 14px; background:var(--card); border:1px solid var(--border); border-radius:22px; padding:4px; box-shadow:0 2px 8px rgba(20,30,55,.06);}
.yearpill button{width:34px; height:34px; border-radius:50%; border:none; background:var(--cream); color:var(--text); font-size:17px; cursor:pointer; font-family:inherit;}
.yearpill span{font-weight:700; font-size:15px;}
.rgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
.rcard{background:var(--card); border:1px solid var(--border); border-radius:18px; padding:14px; cursor:pointer; box-shadow:0 2px 8px rgba(20,30,55,.05);}
.rcard .rc-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
.rcard .cic{width:38px; height:38px; border-radius:13px; margin-bottom:0; display:flex; align-items:center; justify-content:center;}
.rcard .rc-pct{font-size:10.5px; font-weight:700; padding:4px 9px; border-radius:20px; background:var(--cream); color:var(--muted);}
.rcard .lbl{font-size:12px; color:var(--muted); font-weight:500; margin-bottom:3px;}
.rcard .rc-val{font-size:17px; font-weight:700; white-space:nowrap;}
header.hmain{box-shadow:none;}
header.hmain::before{display:none;}
header.hmain .hic{box-shadow:none;}
.hbar{background:rgba(255,255,255,.08);}
.hnav{background:none;}
.hero{padding:20px; background:linear-gradient(135deg,#243a62,#2c4676); box-shadow:0 8px 20px rgba(20,30,55,.14);}
.hero::before,.hero::after{display:none;}
.hero-lbl{font-size:12px; font-weight:500; opacity:.75; margin-bottom:6px;}
.hero-val{font-size:30px; margin-bottom:16px;}
.hero-stats,.hero-stats.three{display:flex; gap:0; border-top:1px solid rgba(255,255,255,.14); padding-top:12px;}
.hero-st{flex:1; min-width:0; background:none; border:none; border-radius:0; padding:0 14px; border-left:1px solid rgba(255,255,255,.14);}
.hero-st:first-child{padding-left:0; border-left:none;}
.hero-st small{font-size:10.5px; opacity:.7;}
.hero-st b,.hero-stats.three .hero-st b{font-size:13px;}
.rcard{box-shadow:none; padding:16px;}
.rcard .cic{background:var(--cream); color:var(--navy);}
.rcard .rc-top{margin-bottom:12px;}
.rcard .rc-val{color:var(--text);}
:root[data-theme="dark"] .rcard .cic{color:var(--text);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rcard .cic{color:var(--text);}}
.hero{background:var(--card); color:var(--text); border:1px solid var(--border); box-shadow:none;}
.hero-lbl{color:var(--muted); opacity:1;}
.hero-val{color:var(--navy);}
.hero-stats,.hero-stats.three{border-top:1px solid var(--border);}
.hero-st{border-left:1px solid var(--border);}
.hero-st small{color:var(--muted); opacity:1;}
.hero-st b,.hero-stats.three .hero-st b{color:var(--text);}
:root[data-theme="dark"] .hero-val{color:var(--text);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero-val{color:var(--text);}}
.hero.tint-green,.rcard.tint-green{background:linear-gradient(135deg,#e5f6ea,#d5f0dd); border-color:#bfe4cb;}
.tint-green .hero-val,.rc-val.green{color:#217a4b;}
.hero.tint-red,.rcard.tint-red{background:linear-gradient(135deg,#fbeae7,#f6d9d4); border-color:#eec3bc;}
.tint-red .hero-val,.rc-val.red{color:#b3392a;}
.hero.tint-amber,.rcard.tint-amber{background:linear-gradient(135deg,#fdf3e0,#fbe8c6); border-color:#f3dba8;}
.tint-amber .hero-val,.rc-val.amber{color:#b9812e;}
.hero.tint-blue,.rcard.tint-blue{background:linear-gradient(135deg,#eaf1fb,#dde9f9); border-color:#c9dcf5;}
.hero-val.pos{color:#217a4b;} .hero-val.neg{color:#b3392a;}
.rc-val.blue{color:var(--text);}
.rcard .cic.green{background:#2f9e5f; color:#fff;} .rcard .cic.blue{background:#4f7fe8; color:#fff;} .rcard .cic.amber{background:#e8a53d; color:#fff;} .rcard .cic.red{background:#d9695a; color:#fff;}
.hero[class*="tint-"] .hero-stats{border-top-color:rgba(0,0,0,.09);}
.hero[class*="tint-"] .hero-st{border-left-color:rgba(0,0,0,.09);}
.hero[class*="tint-"] .hero-lbl,.hero[class*="tint-"] .hero-st small{color:var(--muted);}
:root[data-theme="dark"] .hero.tint-green,:root[data-theme="dark"] .rcard.tint-green{background:linear-gradient(135deg,#173325,#132c20); border-color:#1f4531;}
:root[data-theme="dark"] .hero.tint-red,:root[data-theme="dark"] .rcard.tint-red{background:linear-gradient(135deg,#3a2019,#331b15); border-color:#4a2a20;}
:root[data-theme="dark"] .hero.tint-amber,:root[data-theme="dark"] .rcard.tint-amber{background:linear-gradient(135deg,#3a2f18,#332a15); border-color:#4a3c1e;}
:root[data-theme="dark"] .hero.tint-blue,:root[data-theme="dark"] .rcard.tint-blue{background:linear-gradient(135deg,#152238,#111c2e); border-color:#1e3252;}
:root[data-theme="dark"] .hero[class*="tint-"] .hero-stats{border-top-color:rgba(255,255,255,.12);}
:root[data-theme="dark"] .hero[class*="tint-"] .hero-st{border-left-color:rgba(255,255,255,.12);}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .hero.tint-green,:root:not([data-theme="light"]) .rcard.tint-green{background:linear-gradient(135deg,#173325,#132c20); border-color:#1f4531;}
  :root:not([data-theme="light"]) .hero.tint-red,:root:not([data-theme="light"]) .rcard.tint-red{background:linear-gradient(135deg,#3a2019,#331b15); border-color:#4a2a20;}
  :root:not([data-theme="light"]) .hero.tint-amber,:root:not([data-theme="light"]) .rcard.tint-amber{background:linear-gradient(135deg,#3a2f18,#332a15); border-color:#4a3c1e;}
  :root:not([data-theme="light"]) .hero.tint-blue,:root:not([data-theme="light"]) .rcard.tint-blue{background:linear-gradient(135deg,#152238,#111c2e); border-color:#1e3252;}
}

/* ===== Novo card hero (Início, Diário, A Receber, A Pagar) ===== */
.hero2{
  position:relative; overflow:hidden; border-radius:26px; padding:18px 16px 14px; margin-bottom:16px;
  border:1px solid var(--border); background:var(--card);
  --ac:#217a4b; --acbg:rgba(47,158,95,.18); --panel:rgba(255,255,255,.78); --sep:rgba(0,0,0,.10);
}
.hero2.t-blue{background:linear-gradient(135deg,#eaf1fb,#dde9f9); border-color:#c9dcf5;}
.hero2.t-green{background:linear-gradient(135deg,#f7fcf9,#eef8f2); border-color:#d8eee2;}
.hero2.t-red{background:linear-gradient(135deg,#fef8f7,#fbf0ee); border-color:#f3dcd8; --ac:#b3392a; --acbg:rgba(217,105,90,.20);}
.hero2.t-amber{background:linear-gradient(135deg,#fdf3e0,#fbe8c6); border-color:#f3dba8; --ac:#b9812e; --acbg:rgba(232,165,61,.24);}
.hero2.neg{--ac:#b3392a; --acbg:rgba(217,105,90,.20);}
:root[data-theme="dark"] .hero2{--panel:rgba(255,255,255,.06); --sep:rgba(255,255,255,.12); --ac:#5fd38d; --acbg:rgba(95,211,141,.16);}
:root[data-theme="dark"] .hero2.t-blue{background:linear-gradient(135deg,#152238,#111c2e); border-color:#1e3252;}
:root[data-theme="dark"] .hero2.t-green{background:linear-gradient(135deg,#122419,#0f1f16); border-color:#1a3a28;}
:root[data-theme="dark"] .hero2.t-red{background:linear-gradient(135deg,#2a1713,#24130f); border-color:#3c211a; --ac:#ff9d8f; --acbg:rgba(255,157,143,.16);}
:root[data-theme="dark"] .hero2.t-amber{background:linear-gradient(135deg,#3a2f18,#332a15); border-color:#4a3c1e; --ac:#e8c887; --acbg:rgba(232,200,135,.16);}
:root[data-theme="dark"] .hero2.neg{--ac:#ff9d8f; --acbg:rgba(255,157,143,.16);}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .hero2{--panel:rgba(255,255,255,.06); --sep:rgba(255,255,255,.12); --ac:#5fd38d; --acbg:rgba(95,211,141,.16);}
  :root:not([data-theme="light"]) .hero2.t-blue{background:linear-gradient(135deg,#152238,#111c2e); border-color:#1e3252;}
  :root:not([data-theme="light"]) .hero2.t-green{background:linear-gradient(135deg,#122419,#0f1f16); border-color:#1a3a28;}
  :root:not([data-theme="light"]) .hero2.t-red{background:linear-gradient(135deg,#2a1713,#24130f); border-color:#3c211a; --ac:#ff9d8f; --acbg:rgba(255,157,143,.16);}
  :root:not([data-theme="light"]) .hero2.t-amber{background:linear-gradient(135deg,#3a2f18,#332a15); border-color:#4a3c1e; --ac:#e8c887; --acbg:rgba(232,200,135,.16);}
  :root:not([data-theme="light"]) .hero2.neg{--ac:#ff9d8f; --acbg:rgba(255,157,143,.16);}
}
.hero2 .h2-blob{position:absolute; right:-34px; top:-26px; width:170px; height:130px; background:var(--acbg); border-radius:58% 42% 30% 70% / 60% 30% 70% 40%; pointer-events:none;}
.hero2 .h2-blobic{position:absolute; right:22px; top:18px; color:var(--ac); pointer-events:none;}
.hero2 .h2-blobic .i{width:38px; height:38px; stroke-width:2.1;}
.hero2 .h2-top{position:relative; display:flex; align-items:center; gap:10px; margin-bottom:6px;}
.hero2 .h2-tic{color:var(--ac); display:flex; flex-shrink:0;}
.hero2 .h2-tic .i{width:26px; height:26px;}
.hero2 .h2-lbl{font-size:15.5px; font-weight:600; color:var(--text);}
.hero2 .h2-val{position:relative; font-family:'Inter',system-ui,sans-serif; font-weight:800; font-size:32px; letter-spacing:-.8px; color:var(--ac); white-space:nowrap; margin:2px 0 14px; padding-right:60px;}
.hero2 .h2-panel{position:relative; display:flex; background:var(--panel); border-radius:18px; padding:12px 4px;}
.hero2 .h2-st{flex:1; min-width:0; padding:0 10px; border-left:1px solid var(--sep);}
.hero2 .h2-st:first-child{border-left:none;}
.hero2 .h2-st-top{display:flex; align-items:center; gap:6px; margin-bottom:6px; min-width:0;}
.hero2 .h2-sic{width:26px; height:26px; border-radius:50%; background:var(--acbg); color:var(--ac); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.hero2 .h2-sic .i{width:14px; height:14px; stroke-width:2.1;}
.hero2 .h2-slbl{font-size:10.5px; font-weight:500; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.hero2 .h2-st b{display:block; font-size:12.5px; font-weight:800; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
/* Tela Diário: ícone em cima e nome embaixo (nome completo, sem cortar) + destaque do gasto do dia */
.hero2.diario-hero .h2-panel{gap:4px; padding:8px 6px; align-items:stretch;}
.hero2.diario-hero .h2-st{padding:6px 8px; border-left:none; border-radius:14px;}
.hero2.diario-hero .h2-st-top{flex-direction:column; align-items:flex-start; gap:5px;}
.hero2.diario-hero .h2-slbl{white-space:normal; overflow:visible; text-overflow:clip; line-height:1.2;}
.hero2.diario-hero .h2-st b{font-size:12px;}
/* Celular: os três valores do Dia a Dia aparecem inteiros, sem cortar */
@media (max-width:480px){
  .hero2.diario-hero .h2-panel.tones{gap:4px; padding:4px;}
  .hero2.diario-hero .h2-panel.tones .h2-st{padding:8px 6px 9px; flex:1;}
  .hero2.diario-hero .h2-panel.tones .h2-st b{font-size:11px; overflow:visible; text-overflow:clip;}
  .hero2.diario-hero .h2-panel.tones .h2-st.h2-hl b{font-size:12px;}
  .hero2.diario-hero .h2-hl-cal{right:6px;}
}
.hero2.diario-hero .h2-st.h2-hl{position:relative; cursor:pointer; flex:1.35; background:linear-gradient(135deg,#d9a441,#b9812e); box-shadow:0 4px 12px rgba(185,129,46,.35);}
.hero2.diario-hero .h2-hl-cal{position:absolute; top:7px; right:9px; font-size:12px; line-height:1; pointer-events:none;}
.hero2.diario-hero .h2-st.h2-hl .h2-slbl{color:rgba(255,255,255,.92); font-weight:700;}
.hero2.diario-hero .h2-st.h2-hl b{color:#fff; font-size:15.5px; letter-spacing:-.3px;}
.hero2.diario-hero .h2-st.h2-hl .h2-sic{background:rgba(255,255,255,.28); color:#fff;}
:root[data-theme="dark"] .hero2.diario-hero .h2-st.h2-hl{background:linear-gradient(135deg,#f0d49a,#e8c887); box-shadow:0 4px 12px rgba(0,0,0,.35);}
:root[data-theme="dark"] .hero2.diario-hero .h2-st.h2-hl .h2-slbl, :root[data-theme="dark"] .hero2.diario-hero .h2-st.h2-hl b{color:#2b2210;}
:root[data-theme="dark"] .hero2.diario-hero .h2-st.h2-hl .h2-sic{background:rgba(43,34,16,.15); color:#2b2210;}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .hero2.diario-hero .h2-st.h2-hl{background:linear-gradient(135deg,#f0d49a,#e8c887); box-shadow:0 4px 12px rgba(0,0,0,.35);}
  :root:not([data-theme="light"]) .hero2.diario-hero .h2-st.h2-hl .h2-slbl, :root:not([data-theme="light"]) .hero2.diario-hero .h2-st.h2-hl b{color:#2b2210;}
  :root:not([data-theme="light"]) .hero2.diario-hero .h2-st.h2-hl .h2-sic{background:rgba(43,34,16,.15); color:#2b2210;}
}

/* ===== Cards de reservas (Gestão) ===== */
.rgrid{align-items:stretch;}
.rsv{position:relative; overflow:hidden; border-radius:22px; padding:14px 14px 15px; cursor:pointer; display:flex; flex-direction:column; min-width:0; background:var(--rbg); border:1px solid var(--rb); -webkit-tap-highlight-color:transparent; transition:transform .15s;}
.rsv:active{transform:scale(.98);}
.rsv>*{position:relative; z-index:1;}
.rsv .rsv-bg{position:absolute; z-index:0; right:-28px; bottom:-34px; width:90px; height:90px; border-radius:50%; background:var(--rblob); pointer-events:none;}
.rsv .rsv-bg svg{position:absolute; left:18px; top:22px; width:30px; height:30px; stroke:rgba(255,255,255,.8); fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
.rsv-top{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.rsv-ic{flex-shrink:0; width:42px; height:42px; border-radius:14px; background:var(--ri); display:flex; align-items:center; justify-content:center; box-shadow:0 4px 10px rgba(0,0,0,.10);}
.rsv-ic svg{width:22px; height:22px; stroke:#fff; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}
.rsv-name{font-size:14px; font-weight:700; line-height:1.25; color:var(--rt); margin-top:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; word-break:normal; overflow-wrap:normal;}
.rsv-go{flex-shrink:0; width:26px; height:26px; border-radius:50%; background:var(--rblob); color:var(--rt); display:flex; align-items:center; justify-content:center; font-size:17px; line-height:1; padding-bottom:2px;}
.rsv-bar{width:26px; height:4px; border-radius:4px; background:var(--rv); opacity:.55; margin:10px 0 8px;}
.rsv-val{font-size:20px; font-weight:800; letter-spacing:-.4px; color:var(--rv); white-space:nowrap; line-height:1.15;}
.rsv-sub{font-size:11px; color:var(--rs); margin-top:5px; line-height:1.3; min-height:2.6em; padding-right:38px; word-break:normal; overflow-wrap:normal;}
.rsv.green{--rbg:linear-gradient(135deg,#e5f6ea,#d5f0dd); --rb:#bfe4cb; --rt:#14503a; --rv:#0f6b43; --rs:#2b6b46; --ri:linear-gradient(135deg,#3fbf7a,#1f8a55); --rblob:rgba(47,158,95,.18);}
.rsv.blue{--rbg:linear-gradient(135deg,#eaf1fb,#dde9f9); --rb:#c9dcf5; --rt:#163a7a; --rv:#0f3a9e; --rs:#3b5a94; --ri:linear-gradient(135deg,#5b8cf5,#2d62d9); --rblob:rgba(79,127,232,.18);}
.rsv.amber{--rbg:linear-gradient(135deg,#fdf3e0,#fbe8c6); --rb:#f3dba8; --rt:#5a3b08; --rv:#7a4f0a; --rs:#8a6b3a; --ri:linear-gradient(135deg,#f7c04a,#d9961c); --rblob:rgba(232,165,61,.24);}
.rsv.red{--rbg:linear-gradient(135deg,#fbeae7,#f6d9d4); --rb:#eec3bc; --rt:#6a1f26; --rv:#c0392b; --rs:#8a5a5e; --ri:linear-gradient(135deg,#ee6f78,#d63a48); --rblob:rgba(217,105,90,.22);}
:root[data-theme="dark"] .rsv.green{--rbg:linear-gradient(135deg,#173325,#132c20); --rb:#1f4531; --rt:#bfeed2; --rv:#5fd38d; --rs:#9adcb4; --rblob:rgba(95,211,141,.14);}
:root[data-theme="dark"] .rsv.blue{--rbg:linear-gradient(135deg,#152238,#111c2e); --rb:#1e3252; --rt:#cfe0ff; --rv:#8fb3ff; --rs:#9fb6e0; --rblob:rgba(143,179,255,.14);}
:root[data-theme="dark"] .rsv.amber{--rbg:linear-gradient(135deg,#3a2f18,#332a15); --rb:#4a3c1e; --rt:#f6e2b4; --rv:#e8c887; --rs:#cdb88a; --rblob:rgba(232,200,135,.14);}
:root[data-theme="dark"] .rsv.red{--rbg:linear-gradient(135deg,#3a2019,#331b15); --rb:#4a2a20; --rt:#ffd3cc; --rv:#ff9d8f; --rs:#d9a8a0; --rblob:rgba(255,157,143,.14);}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .rsv.green{--rbg:linear-gradient(135deg,#173325,#132c20); --rb:#1f4531; --rt:#bfeed2; --rv:#5fd38d; --rs:#9adcb4; --rblob:rgba(95,211,141,.14);}
  :root:not([data-theme="light"]) .rsv.blue{--rbg:linear-gradient(135deg,#152238,#111c2e); --rb:#1e3252; --rt:#cfe0ff; --rv:#8fb3ff; --rs:#9fb6e0; --rblob:rgba(143,179,255,.14);}
  :root:not([data-theme="light"]) .rsv.amber{--rbg:linear-gradient(135deg,#3a2f18,#332a15); --rb:#4a3c1e; --rt:#f6e2b4; --rv:#e8c887; --rs:#cdb88a; --rblob:rgba(232,200,135,.14);}
  :root:not([data-theme="light"]) .rsv.red{--rbg:linear-gradient(135deg,#3a2019,#331b15); --rb:#4a2a20; --rt:#ffd3cc; --rv:#ff9d8f; --rs:#d9a8a0; --rblob:rgba(255,157,143,.14);}
}

/* ===== Tela obrigatória de instalação ===== */
.igate{position:fixed; inset:0; z-index:200; background:var(--cream); color:var(--text); overflow-y:auto; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:calc(28px + env(safe-area-inset-top,0px)) 24px calc(28px + env(safe-area-inset-bottom,0px));}
.igate .g-logo{width:92px; height:92px; border-radius:26px; background:linear-gradient(135deg,#0f1b33,#22375f); display:flex; align-items:center; justify-content:center; margin-bottom:22px; box-shadow:0 14px 30px rgba(20,30,55,.28);}
.igate .g-logo span{width:54px; height:54px; border-radius:50%; background:#e8a53d; color:#122040; font-family:'Playfair Display',Georgia,serif; font-weight:700; font-size:32px; display:flex; align-items:center; justify-content:center; line-height:1;}
.igate h2{margin:0 0 10px; font-size:24px;}
.igate p{margin:0 0 20px; font-size:14px; line-height:1.55; color:var(--muted); max-width:340px;}
.igate .g-btn{width:100%; max-width:340px; background:var(--navy); color:#fff; border:none; border-radius:16px; padding:16px; font-family:inherit; font-weight:700; font-size:15.5px; cursor:pointer; box-shadow:0 10px 22px rgba(20,30,55,.28);}
.igate .g-btn:disabled{opacity:.55; box-shadow:none;}
.igate .g-steps{width:100%; max-width:340px; text-align:left; background:var(--card); border:1px solid var(--border); border-radius:18px; padding:6px 16px; margin-bottom:6px;}
.igate .g-step{display:flex; align-items:flex-start; gap:12px; padding:12px 0; font-size:13.5px; line-height:1.45; border-top:1px solid var(--border);}
.igate .g-step:first-child{border-top:none;}
.igate .g-n{width:24px; height:24px; border-radius:50%; background:var(--navy); color:#fff; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px;}
.igate .g-note{font-size:12px; color:var(--muted); margin-top:16px; max-width:320px; line-height:1.5;}
:root[data-theme="dark"] .igate .g-btn,:root[data-theme="dark"] .igate .g-n{background:#8fb3ff; color:#15181f;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .igate .g-btn,:root:not([data-theme="light"]) .igate .g-n{background:#8fb3ff; color:#15181f;}}

/* ===== Layout responsivo (celular, tablet e telas grandes) ===== */
:root{--maxw:520px;}
@media (min-width:700px){:root{--maxw:860px;}}
@media (min-width:1100px){:root{--maxw:1000px;}}
#app{max-width:var(--maxw);}
nav.bottom{max-width:calc(var(--maxw) - 24px);}
.modal{max-width:min(var(--maxw),640px);}
.formbtns{max-width:var(--maxw);}
.fab,.fabround{right:max(18px, calc((100vw - var(--maxw))/2 + 18px));}
.formscreen main{width:100%; max-width:var(--maxw); margin-left:auto; margin-right:auto;}
.formscreen header.top{padding-left:max(18px, calc((100% - var(--maxw))/2 + 18px)); padding-right:max(18px, calc((100% - var(--maxw))/2 + 18px));}
@media (min-width:700px){
  main{padding:20px 22px 150px;}
  header.top h1{font-size:25px;}
  header.top .month{font-size:13px;}
  .hero2 .h2-lbl{font-size:17px;}
  .hero2 .h2-val{font-size:38px;}
  .hero2 .h2-slbl{font-size:11.5px;}
  .hero2 .h2-st b{font-size:14.5px;}
  .sectionh{font-size:17px;}
  .rgrid{grid-template-columns:repeat(4,1fr); gap:12px;}
  .rsv-name{font-size:14.5px;}
  .rsv-val{font-size:21px;}
  .rsv-sub{font-size:11.5px;}
  /* Tablet: lista em 2 colunas, preenchendo a 1ª de cima para baixo e depois a 2ª (mantém a ordem por data) */
  .list{display:block; column-count:2; column-gap:10px;}
  .list>.row{break-inside:avoid; -webkit-column-break-inside:avoid; page-break-inside:avoid; margin-bottom:10px;}
  .row .cli{font-size:15px;}
  .row .sub{font-size:12.5px;}
  .row .valor{font-size:15px;}
  .catbox .cthead{font-size:16px;}
  .donut{width:150px; height:150px;}
  .catlegend .cl-row{font-size:13px;}
  .catlegend .cl-val{font-size:12px;}
  table.gestao{font-size:13px;}
  table.gestao td{padding:10px 8px;}
  table.gestao th{padding:10px 8px;}
  nav.bottom button{font-size:12px;}
  .fab{font-size:14.5px;}
}


/* ===== Alertas de vencimento ===== */
.vb{display:inline-block; margin-top:4px; margin-right:4px; font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:20px;}
.vb.late{background:#fbe0dc; color:#a8352a;}
.vb.today{background:#fde9c6; color:#8a5a0a;}
.vb.soon{background:#e0ebfb; color:#2d5aa8;}
.valert{display:flex; align-items:center; gap:10px; border-radius:16px; padding:12px 14px; margin:-4px 0 14px; cursor:pointer; font-size:12.5px; font-weight:600; line-height:1.45; border:1px solid var(--border);}
.valert .vx{flex:1; min-width:0;}
.valert .chev{opacity:.6; font-size:18px;}
.valert.late{background:#fbeae7; border-color:#eec3bc; color:#a8352a;}
.valert.today{background:#fdf3e0; border-color:#f3dba8; color:#8a5a0a;}
.valert.soon{background:#eaf1fb; border-color:#c9dcf5; color:#2d5aa8;}
.vcard{background:var(--card); border:1px solid var(--border); border-radius:18px; padding:14px 16px; margin:-4px 0 16px;}
.vc-h{font-weight:700; font-size:14px; margin-bottom:8px;}
.vc-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--border); cursor:pointer;}
.vc-row .vc-l{font-weight:600; font-size:13px; width:68px; flex-shrink:0;}
.vc-row .vc-chips{flex:1; min-width:0; display:flex; flex-wrap:wrap; gap:2px;}
.vc-row .vb{margin-top:0;}
.vc-row .chev{color:var(--muted); font-size:18px;}
.vc-link{margin-top:6px; padding-top:10px; border-top:1px solid var(--border); font-size:12.5px; font-weight:600; color:var(--navy); cursor:pointer;}
:root[data-theme="dark"] .vb.late{background:#4a2a20; color:#ffb3a8;}
:root[data-theme="dark"] .vb.today{background:#4a3c1e; color:#e8c887;}
:root[data-theme="dark"] .vb.soon{background:#1e3252; color:#9fc0ff;}
:root[data-theme="dark"] .valert.late{background:#3a2019; border-color:#4a2a20; color:#ffb3a8;}
:root[data-theme="dark"] .valert.today{background:#3a2f18; border-color:#4a3c1e; color:#e8c887;}
:root[data-theme="dark"] .valert.soon{background:#152238; border-color:#1e3252; color:#9fc0ff;}
:root[data-theme="dark"] .vc-link{color:#8fb3ff;}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .vb.late{background:#4a2a20; color:#ffb3a8;}
  :root:not([data-theme="light"]) .vb.today{background:#4a3c1e; color:#e8c887;}
  :root:not([data-theme="light"]) .vb.soon{background:#1e3252; color:#9fc0ff;}
  :root:not([data-theme="light"]) .valert.late{background:#3a2019; border-color:#4a2a20; color:#ffb3a8;}
  :root:not([data-theme="light"]) .valert.today{background:#3a2f18; border-color:#4a3c1e; color:#e8c887;}
  :root:not([data-theme="light"]) .valert.soon{background:#152238; border-color:#1e3252; color:#9fc0ff;}
  :root:not([data-theme="light"]) .vc-link{color:#8fb3ff;}
}

/* ===== Capa (splash, bloqueio e cadastro) ===== */
.splash,.formscreen.cover,.ob-hero{background:radial-gradient(circle at 100% 0%, rgba(74,222,128,.95) 0%, rgba(16,179,160,.75) 24%, rgba(16,120,170,0) 62%), linear-gradient(180deg,#0a4aa0 0%,#08327a 52%,#061f58 100%);}
.splash{position:fixed; inset:0; z-index:500; display:flex; align-items:center; justify-content:center; text-align:center; color:#fff; transition:opacity .5s ease, transform .5s ease;}
.splash.out{opacity:0; transform:scale(1.03); pointer-events:none;}
.sp-in{display:flex; flex-direction:column; align-items:center; animation:spin .7s ease-out both;}
@keyframes spin{from{opacity:0; transform:translateY(14px) scale(.96);}to{opacity:1; transform:none;}}
.sp-t{font-family:'Inter',system-ui,sans-serif; font-weight:800; font-size:40px; letter-spacing:-.5px; margin-top:8px;}
.sp-s{font-size:15px; opacity:.82; margin-top:8px;}
.cover-svg{display:block;}
.cover-svg .sp-bar{transform-box:fill-box; transform-origin:50% 100%; animation:spbar .8s cubic-bezier(.2,.8,.2,1) both;}
.cover-svg .sp-b1{animation-delay:.25s;} .cover-svg .sp-b2{animation-delay:.4s;} .cover-svg .sp-b3{animation-delay:.55s;}
@keyframes spbar{from{transform:scaleY(0);}to{transform:scaleY(1);}}
.cover-svg .sp-arrow{stroke-dasharray:200; stroke-dashoffset:200; animation:sparrow 1s ease-out .7s forwards;}
@keyframes sparrow{to{stroke-dashoffset:0;}}
.cover-svg .sp-head{opacity:0; animation:sphead .3s ease-out 1.55s forwards;}
@keyframes sphead{to{opacity:1;}}
.formscreen.cover{color:#fff;}
.formscreen.cover h2{color:#fff;}
.formscreen.cover .btn.primary{background:#22c55e; color:#052e16;}
.ob-hero{border-radius:26px; padding:22px 16px 20px; margin-bottom:18px; text-align:center; color:#fff; display:flex; flex-direction:column; align-items:center;}
.ob-hero .ob-t{font-family:'Inter',system-ui,sans-serif; font-weight:800; font-size:28px; letter-spacing:-.4px; margin-top:4px;}
.ob-hero .ob-s{font-size:13.5px; opacity:.85; margin-top:4px;}

/* ===== Etiqueta de status com ação (pill) ===== */
.badge.act{display:inline-flex; align-items:center; gap:5px; margin-top:6px; padding:9px 14px; font-size:12.5px; font-weight:600; border-radius:22px; cursor:pointer; white-space:nowrap; -webkit-tap-highlight-color:transparent;}
.badge.act:active{transform:scale(.97);}
.badge.pend{background:#f6ecc8; color:#8a6212;}
.badge.done{background:#dcecdf; color:#1f5c3a;}
:root[data-theme="dark"] .badge.pend{background:#4a3a1c; color:#e8c887;}
:root[data-theme="dark"] .badge.done{background:#173325; color:#7fd9a0;}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .badge.pend{background:#4a3a1c; color:#e8c887;}
  :root:not([data-theme="light"]) .badge.done{background:#173325; color:#7fd9a0;}
}
/* ===== Menu ⋮ dos lançamentos ===== */
.menubtn{background:none; border:none; color:var(--muted); cursor:pointer; padding:6px 8px; margin-right:-6px; border-radius:10px; line-height:0; -webkit-tap-highlight-color:transparent;}
.menubtn:active{background:var(--cream);}
.rmenu{position:fixed; z-index:56; min-width:176px; background:var(--card); border:1px solid var(--border); border-radius:14px; box-shadow:0 12px 30px rgba(20,30,55,.25); padding:6px;}
.rmenu button{display:flex; align-items:center; gap:10px; width:100%; padding:12px; border:none; background:none; color:var(--text); font-family:inherit; font-size:14px; font-weight:600; border-radius:10px; cursor:pointer; text-align:left;}
.rmenu button:active{background:var(--cream);}
.rmenu button.danger{color:#b3392a;}

/* ===== Soma das reservas ===== */
.ressoma{font-size:13px; font-weight:700; border-radius:10px; padding:10px 12px; margin:2px 0 12px; line-height:1.4;}
.ressoma.ok{background:#dcecdf; color:#1f5c3a;}
.ressoma.bad{background:#fbeae7; color:#a8352a;}
.btn:disabled{cursor:not-allowed;}
:root[data-theme="dark"] .ressoma.ok{background:#173325; color:#7fd9a0;}
:root[data-theme="dark"] .ressoma.bad{background:#3a2019; color:#ffb3a8;}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .ressoma.ok{background:#173325; color:#7fd9a0;}
  :root:not([data-theme="light"]) .ressoma.bad{background:#3a2019; color:#ffb3a8;}
}

/* ===== Botões do extrato da reserva ===== */
.ex-btns{display:flex; gap:10px; margin-bottom:18px;}
.ex-btns button{flex:1; margin-bottom:0; padding:14px 8px; font-size:13.5px;}
.ex-btnguardar{background:linear-gradient(135deg,#2fae6a,#1f8a55); color:#fff; border:none; border-radius:16px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:6px; font-family:inherit; cursor:pointer; box-shadow:0 8px 18px rgba(31,138,85,.3);}

/* ===== Tabela anual: destaque de meses negativos ===== */
table.gestao tr.cur{font-weight:700;}
table.gestao tr.cur:not(.neg){background:var(--cream);}
table.gestao tr.neg{background:#fdecea;}
table.gestao td.num-neg{color:#b3392a; font-weight:700;}
table.gestao td.num-pos{color:#217a4b; font-weight:700;}
table.gestao td.num-zero{color:var(--muted);}
:root[data-theme="dark"] table.gestao tr.neg{background:#3a2019;}
:root[data-theme="dark"] table.gestao td.num-neg{color:#ff9d8f;}
:root[data-theme="dark"] table.gestao td.num-pos{color:#5fd38d;}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) table.gestao tr.neg{background:#3a2019;}
  :root:not([data-theme="light"]) table.gestao td.num-neg{color:#ff9d8f;}
  :root:not([data-theme="light"]) table.gestao td.num-pos{color:#5fd38d;}
}

/* ===== Frase do cartão da reserva: "X% do lucro do mês" (sempre completa, quebra linha se precisar) ===== */
.rsv-sub{padding-right:0; min-height:0; white-space:normal; overflow:visible; text-overflow:clip; font-weight:600;}

/* ===== Escolha de escopo (parcelados) ===== */
.escopo-btn{display:block; width:100%; text-align:left; background:var(--cream); border:1px solid var(--border); border-radius:14px; padding:13px 14px; margin-bottom:10px; font-family:inherit; color:var(--text); cursor:pointer; -webkit-tap-highlight-color:transparent;}
.escopo-btn:active{transform:scale(.99);}
.escopo-btn b{display:block; font-size:14px;}
.escopo-btn small{display:block; font-size:12px; color:var(--muted); margin-top:2px;}
.escopo-btn.danger b{color:#b3392a;}

/* ===== Início: cada indicador com a sua cor ===== */
.hero2 .h2-panel.tones{padding:6px; gap:6px; background:transparent;}
.hero2 .h2-panel.tones .h2-st{border-left:none; border-radius:16px; padding:10px 10px 11px;}
.hero2 .tone-green{background:#e3f6ec;}
.hero2 .tone-red{background:#fbdcd6;}
.hero2 .tone-amber{background:#fff0d6;}
.hero2 .tone-green .h2-sic{background:rgba(47,158,95,.22); color:#217a4b;}
.hero2 .tone-red .h2-sic{background:rgba(217,105,90,.24); color:#b3392a;}
.hero2 .tone-amber .h2-sic{background:rgba(232,165,61,.28); color:#a8710f;}
.hero2 .tone-green b{color:#14603c;}
.hero2 .tone-red b{color:#a8352a;}
.hero2 .tone-amber b{color:#8a5a0a;}
:root[data-theme="dark"] .hero2 .tone-green{background:#173325;}
:root[data-theme="dark"] .hero2 .tone-red{background:#3a2019;}
:root[data-theme="dark"] .hero2 .tone-amber{background:#3a2f18;}
:root[data-theme="dark"] .hero2 .tone-green b{color:#7fd9a0;}
:root[data-theme="dark"] .hero2 .tone-red b{color:#ffb3a8;}
:root[data-theme="dark"] .hero2 .tone-amber b{color:#e8c887;}
:root[data-theme="dark"] .hero2 .tone-green .h2-sic{color:#7fd9a0;}
:root[data-theme="dark"] .hero2 .tone-red .h2-sic{color:#ffb3a8;}
:root[data-theme="dark"] .hero2 .tone-amber .h2-sic{color:#e8c887;}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .hero2 .tone-green{background:#173325;}
  :root:not([data-theme="light"]) .hero2 .tone-red{background:#3a2019;}
  :root:not([data-theme="light"]) .hero2 .tone-amber{background:#3a2f18;}
  :root:not([data-theme="light"]) .hero2 .tone-green b{color:#7fd9a0;}
  :root:not([data-theme="light"]) .hero2 .tone-red b{color:#ffb3a8;}
  :root:not([data-theme="light"]) .hero2 .tone-amber b{color:#e8c887;}
  :root:not([data-theme="light"]) .hero2 .tone-green .h2-sic{color:#7fd9a0;}
  :root:not([data-theme="light"]) .hero2 .tone-red .h2-sic{color:#ffb3a8;}
  :root:not([data-theme="light"]) .hero2 .tone-amber .h2-sic{color:#e8c887;}
}

/* ===== Extrato do mês: alternar Geral / Por categoria ===== */
.seg{display:flex; gap:4px; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:4px; margin-bottom:14px;}
.seg button{flex:1; border:none; background:none; padding:10px 8px; border-radius:11px; font-family:inherit; font-weight:600; font-size:13px; color:var(--muted); cursor:pointer; -webkit-tap-highlight-color:transparent;}
.seg button.on{background:var(--navy); color:#fff;}
:root[data-theme="dark"] .seg button.on{background:#8fb3ff; color:#15181f;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button.on{background:#8fb3ff; color:#15181f;}}
.catx{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:12px; margin-bottom:8px;}
.catx-top{display:flex; align-items:center; gap:10px;}
.catx-top .ric{width:38px; height:38px; border-radius:50%; background:#e9edf5; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;}
:root[data-theme="dark"] .catx-top .ric{background:#2a3040;}
.catx-top .info{flex:1; min-width:0;}
.catx-top .cli{font-weight:600; font-size:14px;}
.catx-top .sub{font-size:11.5px; color:var(--muted); margin-top:2px;}
.catx-top .valor{font-weight:700; font-size:14px; white-space:nowrap;}
.catx-bar{height:8px; border-radius:8px; background:var(--cream); margin-top:10px; overflow:hidden;}
.catx-bar i{display:block; height:100%; border-radius:8px;}

/* ===== Por categoria: despesas de cada categoria ===== */
.catx{cursor:pointer; -webkit-tap-highlight-color:transparent;}
.catx-chev{color:var(--muted); font-size:20px; line-height:1; transition:transform .2s; flex-shrink:0;}
.catx-chev.open{transform:rotate(90deg);}
.catx-list{margin-top:10px; border-top:1px solid var(--border);}
.catx-item{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 2px; border-bottom:1px solid var(--border);}
.catx-item:last-child{border-bottom:none; padding-bottom:2px;}
.catx-item .ci-l{min-width:0;}
.catx-item .ci-n{font-weight:600; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.catx-item .ci-d{font-size:11.5px; color:var(--muted); margin-top:2px;}
.catx-item .ci-v{font-weight:700; font-size:13px; color:#b3392a; white-space:nowrap;}

/* rótulos dos três indicadores sem cortar ("A receber") */
.hero2 .h2-panel.tones .h2-st{padding:10px 8px 11px;}
.hero2 .h2-panel.tones .h2-st-top{gap:5px;}
.hero2 .h2-panel.tones .h2-sic{width:22px; height:22px;}
.hero2 .h2-panel.tones .h2-sic .i{width:12px; height:12px;}
.hero2 .h2-panel.tones .h2-slbl{font-size:10.5px; overflow:visible; text-overflow:clip;}

/* ===== Reservas: cores novas e editor ===== */
.rsv.teal{--rbg:linear-gradient(135deg,#e1f5f2,#cdeee9); --rb:#b5e3dc; --rt:#0f4f48; --rv:#0b6b60; --rs:#2b6b64; --ri:linear-gradient(135deg,#2bb5a5,#12877a); --rblob:rgba(32,176,160,.2);}
.rsv.purple{--rbg:linear-gradient(135deg,#f0ecfb,#e3dcf7); --rb:#d3c8f1; --rt:#3d2a78; --rv:#4b33a0; --rs:#6a5aa8; --ri:linear-gradient(135deg,#8b7cf0,#5b46d0); --rblob:rgba(123,104,224,.2);}
:root[data-theme="dark"] .rsv.teal{--rbg:linear-gradient(135deg,#112b29,#0e2422); --rb:#1b4541; --rt:#bff2ea; --rv:#4fd6c3; --rs:#8fd9cf; --rblob:rgba(79,214,195,.14);}
:root[data-theme="dark"] .rsv.purple{--rbg:linear-gradient(135deg,#221e3a,#1c1930); --rb:#352f5c; --rt:#dcd5ff; --rv:#a99bff; --rs:#b8aef0; --rblob:rgba(169,155,255,.14);}

  const stats=o.stats.map(s=>`<div class="h2-st${s.tone?' tone-'+s.tone:''}${s.hl?' h2-hl':''}"${s.go?` onclick="event.stopPropagation();goTab('${s.go}')" style="cursor:pointer;"`:(s.click?` onclick="event.stopPropagation();${s.click}" style="cursor:pointer;"`:'')}><div class="h2-st-top"><span class="h2-sic">${s.icon}</span><span class="h2-slbl">${s.label}${s.pct?` <span class="h2-pctl">${s.pct}</span>`:''}</span></div><b>${s.val}</b>${s.extra||''}</div>`).join('');
  return `<div class="hero2 ${o.cls}"${o.go?` onclick="goTab('${o.go}')" style="cursor:pointer;"`:''}>
    <div class="h2-blob"></div><div class="h2-blobic">${o.blobIcon}</div>
    <div class="h2-top"><span class="h2-tic">${o.icon}</span><span class="h2-lbl">${o.label}${o.pct?` <span class="h2-lblpct">${o.pct}</span>`:''}</span></div>
    <div class="h2-val">${o.value}</div>
    <div class="h2-panel${o.stats.some(s=>s.tone)?' tones':''}">${stats}</div>
  </div>`;
}
function shiftPeriod(d){
  curMonth+=d;
  if(curMonth<0){curMonth=11;curYear--;}
  if(curMonth>11){curMonth=0;curYear++;}
  render();
}
function brl(n){return 'R$ '+n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function seed(){
  return {
    receber:[],
    pagar:[],
    hist:{},
    reservas:{imprevistos:50,projeto:20,pessoal:20,doacoes:10},
    reservaNomes:{imprevistos:'Imprevistos',projeto:'Projeto Anual',pessoal:'Pessoal',doacoes:'Doações'},
    reservaOrdem:['imprevistos','projeto','pessoal','doacoes'], reservaVis:{},
    reservaHist:[{desde:0,reservas:{imprevistos:50,projeto:20,pessoal:20,doacoes:10}}],
    customCats:[], catColors:{}, hiddenCats:[], catsPor:{pagar:{custom:[],hidden:[]},receber:{custom:[],hidden:[]},diario:{custom:[],hidden:[]}}, diarios:[], capitalGiro:0, customFormas:[], notifPref:true, pin:null, perfil:{nome:'',email:''}, theme:'auto', ano:'2026', reservaSaidas:[], reservaEntradas:[]
  };
}
let S=load();
if(S.theme && S.theme!=='auto') document.documentElement.setAttribute('data-theme',S.theme);
let settingsSubScreen=null;
function load(){
  try{
    const r=localStorage.getItem(KEY);
    const s=r?JSON.parse(r):seed();
    if(!s.receber) s.receber=[];
    if(!s.pagar) s.pagar=[];
    if(!s.hist) s.hist={};
    if(!s.reservas) s.reservas={imprevistos:50,projeto:20,pessoal:20,doacoes:10};
    if(!s.reservaNomes) s.reservaNomes={imprevistos:'Imprevistos',projeto:'Projeto Anual',pessoal:'Pessoal',doacoes:'Doações'};
    if(!s.reservaOrdem) s.reservaOrdem=Object.keys(s.reservas);
    if(!s.reservaVis) s.reservaVis={};
    // histórico das porcentagens: quem já usa o app começa com as porcentagens de hoje valendo desde o início
    if(!Array.isArray(s.reservaHist)||!s.reservaHist.length) s.reservaHist=[{desde:0,reservas:Object.assign({},s.reservas)}];
    if(!s.customCats) s.customCats=[];
    if(!s.catColors) s.catColors={};
    if(!s.hiddenCats) s.hiddenCats=[];
    if(!s.diarios) s.diarios=[];
    if(s.capitalGiro===undefined) s.capitalGiro=0;
    if(!s.customFormas) s.customFormas=[];
    if(s.notifPref===undefined) s.notifPref=true;
    if(s.notifDias===undefined) s.notifDias=3;
    if(s.pin===undefined) s.pin=null;
    if(!s.perfil) s.perfil={nome:'',email:''};
    if(!s.catsPor){ s.catsPor={}; ['pagar','receber','diario'].forEach(k=>{ s.catsPor[k]={custom:[...s.customCats],hidden:[...s.hiddenCats]}; }); }
    if(!s.reservaSaidas) s.reservaSaidas=[];
    if(!s.reservaEntradas) s.reservaEntradas=[];
    return s;
  }catch(e){return seed();}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} agendaSyncNotif(); nuvemMarcarSujo();}
let tab='resultado';
const hojeInicial=new Date();
let curMonth=hojeInicial.getMonth(); // mês atual de verdade
let curYear=hojeInicial.getFullYear();
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
let diaSel=todayStr();
let diarioSort='hora_desc';
// mantém a data de referência do Diário dentro do mês selecionado no cabeçalho (mês atual = hoje; outros meses = dia 1)
let calAno=0, calMes=0;
function openDiaCalendario(){ calAno=+diaSel.slice(0,4); calMes=+diaSel.slice(5,7)-1; renderDiaCalendario(); }
function calNav(d){ calMes+=d; if(calMes<0){calMes=11;calAno--;} if(calMes>11){calMes=0;calAno++;} renderDiaCalendario(); }
function calEscolher(ds){ closeCatModal(); escolherDiaDiario(ds); }
function renderDiaCalendario(){
  const pad=n=>String(n).padStart(2,'0');
  const primeiro=new Date(calAno,calMes,1).getDay();
  const dias=new Date(calAno,calMes+1,0).getDate();
  const ym=calAno+'-'+pad(calMes+1);
  const comGasto=new Set(S.diarios.filter(e=>e.data&&e.data.slice(0,7)===ym).map(e=>e.data));
  const hoje=todayStr();
  let cells='';
  for(let i=0;i<primeiro;i++) cells+='<div></div>';
  for(let d=1;d<=dias;d++){
    const ds=ym+'-'+pad(d), sel=(ds===diaSel), ehHoje=(ds===hoje);
    const bg=sel?'#b9812e':'transparent', cor=sel?'#fff':'var(--text)';
    const borda=ehHoje&&!sel?'1.5px solid #b9812e':'1.5px solid transparent';
    const dot=comGasto.has(ds)?`<span style="position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:${sel?'#fff':'#b3392a'};"></span>`:'';
    cells+=`<button onclick="calEscolher('${ds}')" style="position:relative;width:100%;aspect-ratio:1;border-radius:50%;border:${borda};background:${bg};color:${cor};font-family:inherit;font-size:14px;font-weight:${sel||ehHoje?700:500};cursor:pointer;padding:0;">${d}${dot}</button>`;
  }
  const sem=['D','S','T','Q','Q','S','S'].map(x=>`<div style="text-align:center;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0;">${x}</div>`).join('');
  const navBtn='background:var(--cream);border:1px solid var(--border);border-radius:50%;width:34px;height:34px;font-size:18px;color:var(--navy);cursor:pointer;font-family:inherit;';
  document.getElementById('catModalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeCatModal()"><div class="modal">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
      <button style="${navBtn}" onclick="calNav(-1)" aria-label="Mês anterior">‹</button>
      <h2 style="margin:0;font-size:16px;">${MONTHS[calMes].f}/${calAno}</h2>
      <button style="${navBtn}" onclick="calNav(1)" aria-label="Próximo mês">›</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;">${sem}${cells}</div>
    <div style="font-size:11.5px;color:var(--muted);margin:10px 0 0;display:flex;align-items:center;gap:6px;"><span style="width:6px;height:6px;border-radius:50%;background:#b3392a;display:inline-block;"></span>dias com gastos</div>
    <div class="modalbtns"><button class="btn ghost" onclick="closeCatModal()">Fechar</button><button class="btn primary" onclick="calEscolher(todayStr())">Hoje</button></div>
  </div></div>`;
}
function escolherDiaDiario(v){
  if(!v) return;
  diaSel=v; curYear=+v.slice(0,4); curMonth=+v.slice(5,7)-1;
  render();
}
function syncDiaSel(){
  const ym=curYear+'-'+String(curMonth+1).padStart(2,'0');
  if(diaSel.slice(0,7)!==ym){
    const h=new Date();
    diaSel=(h.getFullYear()===curYear&&h.getMonth()===curMonth)?todayStr():ym+'-01';
  }
}

function monthIndexFromRef(ref){
  const nome=ref.split('/')[0].trim().toLowerCase();
  return MONTHS.findIndex(m=>m.f.toLowerCase()===nome);
}
function yearFromRef(ref){
  const p=ref.split('/')[1];
  return p?p.trim():null;
}
function sumFor(list,idx,year=curYear){return list.filter(e=>monthIndexFromRef(e.referencia)===idx&&yearFromRef(e.referencia)===String(year)).reduce((s,e)=>s+e.valor,0);}
function sumStatus(list,idx,statuses,year=curYear){return list.filter(e=>monthIndexFromRef(e.referencia)===idx&&yearFromRef(e.referencia)===String(year)&&statuses.includes(e.status)).reduce((s,e)=>s+e.valor,0);}

function fmtVenc(v){const[y,m,d]=v.split('-');return d+'/'+m+'/'+y;}

function renderMonthSel(){
  const btn=document.getElementById('monthSel');
  btn.textContent=`${MONTHS[curMonth].f}/${curYear}`;
}

function render(){
  renderMonthSel();
  syncDiaSel();
  const c=document.getElementById('content');
  const title=document.getElementById('pageTitle');
  const sub=document.getElementById('pageSub');
  document.querySelectorAll('nav.bottom button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  document.getElementById('fabAdd').style.display=(tab==='receber'||tab==='pagar'||tab==='diario')?'flex':'none';
  document.getElementById('fabAddLabel').textContent=tab==='diario'?'Novo gasto':(tab==='receber'?'Novo recebimento':'Nova conta a pagar');
  document.getElementById('monthSel').style.display='block';
  const hIc=document.getElementById('headerIcon');
[tab];
  hIc.innerHTML={receber:ICO.down,pagar:ICO.up,diario:ICO.cal,resultado:ICO.home,gestao:ICO.bank}[tab];
  hIc.style.background={receber:'#e8a53d',pagar:'rgba(255,255,255,.14)',diario:'#2d6cdf',resultado:'#2d6cdf',gestao:'rgba(255,255,255,.14)'}[tab];
  if(tab==='receber'){title.textContent='A Receber'; sub.textContent=MONTHS[curMonth].f+'/'+curYear; renderList(c,S.receber,'cliente','A Receber','Recebido');}
  else if(tab==='pagar'){title.textContent='A Pagar'; sub.textContent=MONTHS[curMonth].f+'/'+curYear; renderList(c,S.pagar,'conta','A Pagar','Pago');}
  else if(tab==='diario'){title.textContent='Despesas Diárias'; sub.textContent='Acompanhe seus gastos do dia a dia'; renderDiario(c);}
  else if(tab==='resultado'){
    title.textContent='Olá, Bem-vindo(a)!';
    sub.textContent=(S.perfil&&S.perfil.nome)?S.perfil.nome:'Configure seu perfil em Configurações';
    renderInicio(c);
  }
  else{title.textContent='Gestão'; sub.textContent='Acumulado até '+MONTHS[curMonth].f+'/'+curYear; renderGestao(c);}
}

function renderList(c,list,nameKey,pendLabel,doneLabel){
  const items=list.filter(e=>monthIndexFromRef(e.referencia)===curMonth&&yearFromRef(e.referencia)===String(curYear));
  const totalPend=items.filter(e=>e.status===pendLabel).reduce((s,e)=>s+e.valor,0);
  const totalDone=items.filter(e=>e.status===doneLabel).reduce((s,e)=>s+e.valor,0);
  const isReceber=pendLabel==='A Receber';
  const totGeral=totalPend+totalDone;
  let html=heroHtml({
    cls:isReceber?'t-green':'t-red',
    icon:isReceber?ICO.down:ICO.up,
    blobIcon:isReceber?ICO.trend:ICO.chart,
    label:'Total do mês',
    value:brl(totGeral),
    stats:[
      {icon:isReceber?ICO.down:ICO.up,label:isReceber?'A receber':'A pagar',val:brl(totalPend),tone:isReceber?'green':'red'},
      {icon:ICO.check,label:isReceber?'Recebido':'Pago',val:brl(totalDone),tone:isReceber?'green':'red'},
      {icon:ICO.receipt,label:'Lançamentos',val:String(items.length),tone:isReceber?'green':'red'}
    ]
  });
  html+=alertaTipoHtml(isReceber?'r':'p');
  html+=catChartHtml(items,isReceber);
  html+=`<div class="sectionh" style="display:flex;justify-content:space-between;align-items:center;">
    <span>Últimos lançamentos</span>
    <button onclick="abrirExtrato('${isReceber?'receber':'pagar'}')" style="background:var(--cream);border:1px solid var(--border);border-radius:20px;padding:6px 12px;font-size:11.5px;font-weight:600;color:var(--navy);font-family:inherit;cursor:pointer;">📋 Extrato do mês ›</button>
  </div>`;
  // Ordena por data de vencimento; pagos/recebidos vão para o fim da lista
  const sortedItems=[...items].sort((a,b)=>{
    const da=a.status===doneLabel?1:0, db=b.status===doneLabel?1:0;
    if(da!==db) return da-db;
    return (a.venc||'').localeCompare(b.venc||'');
  });
  if(!sortedItems.length){html+='<div class="empty"><div class="eic">📄➕</div><div class="et">Nenhum lançamento neste mês.</div><div class="es">Toque em "Novo lançamento" para adicionar.</div></div>';}
  else{
    html+='<div class="list">'+sortedItems.map(e=>`
      <div class="row" onclick="openNovoModal('${e.id}')">
        <div class="left">
          <div class="ric">${iconFor(e.tipo)}</div>
          <div class="info">
            <div class="cli">${esc(e[nameKey])}</div>
            <div class="sub">${esc(e.tipo)} · ${esc(e.descricao)}</div>
            <div class="sub">📅 Venc. ${fmtVenc(e.venc)}</div>
            ${vencBadgeHtml(e)}
          </div>
        </div>
        <div class="right">
          <div class="valor">${brl(e.valor)}</div>
          <span class="badge act ${e.status===pendLabel?'pend':'done'}" onclick="event.stopPropagation();toggleStatus('${tab}','${e.id}','${pendLabel}','${doneLabel}')">${e.status===pendLabel?'✓ Marcar como '+(isReceber?'recebido':'pago'):'✔ '+doneLabel}</span><br>
          <button class="menubtn" aria-label="Mais opções" onclick="openRowMenu(event,'${e.id}')"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
        </div>
      </div>`).join('')+'</div>';
  }
  c.innerHTML=html;
}
function catChartHtml(items,isReceber){
  const map={};
  items.forEach(e=>{map[e.tipo]=(map[e.tipo]||0)+e.valor;});
  const total=Object.values(map).reduce((a,b)=>a+b,0);
  if(!total) return '';
  const arr=Object.entries(map).sort((a,b)=>b[1]-a[1]).map(([name,val])=>({name,val,pct:Math.round(val/total*100),color:colorForCat(name)}));
  let cum=0;
  const stops=arr.map(c=>{const s=cum; cum+=c.pct; return `${c.color} ${s}% ${cum}%`;}).join(', ');
  const legend=arr.map(c=>`<div class="cl-row"><span class="dot2" style="background:${c.color}"></span><span class="cl-name">${esc(c.name)}</span><span class="cl-val">${brl(c.val)}</span><span class="cl-pct">${c.pct}%</span></div>`).join('');
  return `<div class="catbox">
    <div class="cthead"><span>🥧</span>${isReceber?'Receitas por categorias':'Gastos por categoria'}</div>
    <div class="catwrap">
      <div class="donut" style="background:conic-gradient(${stops})"><div class="dctr"><b>${brl(total)}</b><span>total</span></div></div>
      <div class="catlegend">${legend}</div>
    </div>
  </div>`;
}
function diarioItemsForDay(d){return S.diarios.filter(e=>e.data===d);}
function diarioItemsForMonth(d){const ym=d.slice(0,7); return S.diarios.filter(e=>e.data&&e.data.slice(0,7)===ym);}
function diarioChartHtml(items,totalLabel){
  const map={};
  items.forEach(e=>{map[e.categoria]=(map[e.categoria]||0)+e.valor;});
  const total=Object.values(map).reduce((a,b)=>a+b,0);
  if(!total) return `<div class="catbox"><div class="cthead"><span>🥧 Gastos por categorias</span></div><div class="empty" style="margin-top:0;"><div class="eic">📄</div><div class="et">Nenhum gasto para mostrar.</div></div></div>`;
  const arr=Object.entries(map).sort((a,b)=>b[1]-a[1]).map(([name,val])=>({name,val,pct:Math.round(val/total*100),color:colorForCat(name)}));
  let cum=0;
  const stops=arr.map(c=>{const s=cum; cum+=c.pct; return `${c.color} ${s}% ${cum}%`;}).join(', ');
  const legend=arr.map(c=>`<div class="cl-row"><span class="dot2" style="background:${c.color}"></span><span class="cl-name">${esc(c.name)}</span><span class="cl-val">${brl(c.val)}</span><span class="cl-pct">${c.pct}%</span></div>`).join('');
  return `<div class="catbox">
    <div class="cthead"><span>🥧 Gastos por categorias</span></div>
    <div class="catwrap">
      <div class="donut" style="background:conic-gradient(${stops})"><div class="dctr"><b>${brl(total)}</b><span>${totalLabel}</span></div></div>
      <div class="catlegend">${legend}</div>
    </div>
  </div>`;
}
function renderDiario(c){
  const dayItems=diarioItemsForDay(diaSel);
  const totalDia=dayItems.reduce((s,e)=>s+e.valor,0);
  const monthItems=diarioItemsForMonth(diaSel);
  const totalMes=monthItems.reduce((s,e)=>s+e.valor,0);
  const saldo=(S.capitalGiro||0)-totalMes;
  // média diária do mês: total do mês dividido pelos dias do mês (no mês atual, só até hoje)
  const [anoDia,mesDia]=diaSel.split('-').map(Number);
  const hojeMedia=new Date();
  const ehMesAtual=(hojeMedia.getFullYear()===anoDia && hojeMedia.getMonth()+1===mesDia);
  const diasBaseMedia=ehMesAtual?hojeMedia.getDate():new Date(anoDia,mesDia,0).getDate();
  const mediaDiaMes=diasBaseMedia?totalMes/diasBaseMedia:0;
  const chartItems=monthItems;
  const chartTotalLabel='total do mês';
  const heroCls='t-amber'+(saldo<0?' neg':'');
  const diaLabel=(diaSel===todayStr())?'Gastos de hoje':'Gasto em '+diaSel.slice(8,10)+'/'+diaSel.slice(5,7);
  let html=heroHtml({
    cls:heroCls+' diario-hero',
    icon:ICO.wallet,
    blobIcon:ICO.wallet,
    label:'Capital de giro disponível',
    value:(saldo<0?'- ':'')+brl(Math.abs(saldo)),
    stats:[
      {icon:ICO.receipt,label:diaLabel,val:brl(totalDia),hl:true,click:'openDiaCalendario()',extra:'<span class="h2-hl-cal">📅</span>'},
      {icon:ICO.cal,label:'Total no mês',val:brl(totalMes),tone:'amber'},
      {icon:ICO.chart,label:'Média/dia',val:brl(mediaDiaMes),tone:'amber'}
    ]
  });
  // botão acima do card (canto direito) para definir o capital de giro mensal
  html='<div style="display:flex;justify-content:flex-end;margin-bottom:8px;"><button onclick="openCapitalModal()" style="background:var(--cream);border:1px solid var(--border);border-radius:20px;padding:6px 12px;font-size:11.5px;font-weight:600;color:var(--navy);font-family:inherit;cursor:pointer;">Meu capital de giro</button></div>'+html;
  html+=diarioChartHtml(chartItems,chartTotalLabel);
  html+=`<div class="sectionh" style="display:flex;justify-content:space-between;align-items:center;">
    <span>Lançamentos</span>
    <button onclick="abrirExtrato('diario')" style="background:var(--cream);border:1px solid var(--border);border-radius:20px;padding:6px 12px;font-size:11.5px;font-weight:600;color:var(--navy);font-family:inherit;cursor:pointer;">📋 Extrato do mês ›</button>
  </div>`;
  const sorted=[...monthItems].sort((a,b)=>{
    if(diarioSort==='hora_desc') return (b.data||'').localeCompare(a.data||'')||(b.hora||'').localeCompare(a.hora||'');
    if(diarioSort==='valor_desc') return b.valor-a.valor;
    if(diarioSort==='valor_asc') return a.valor-b.valor;
    return (a.data||'').localeCompare(b.data||'')||(a.hora||'').localeCompare(b.hora||'');
  });
  if(!sorted.length){html+='<div class="empty"><div class="eic">📄➕</div><div class="et">Nenhum gasto neste mês.</div><div class="es">Toque no botão + para adicionar.</div></div>';}
  else{
    html+='<div class="list">'+sorted.map(e=>`
      <div class="row" onclick="openDiarioForm('${e.id}')">
        <div class="left">
          <div class="ric">${iconFor(e.categoria)}</div>
          <div class="info">
            <div class="cli">${esc(e.nome)}</div>
            <div class="sub">${esc(e.categoria)}</div>
          </div>
        </div>
        <div class="right">
          <div class="sub" style="margin-bottom:2px;">${e.data?e.data.slice(8,10)+'/'+e.data.slice(5,7):''}${e.hora?' · '+e.hora:''}</div>
          <div class="valor" style="color:#b3392a">${brl(e.valor)}</div>
          <button class="menubtn" aria-label="Mais opções" onclick="openRowMenu(event,'${e.id}')"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
        </div>
      </div>`).join('')+'</div>';
  }
  c.innerHTML=html;
}
let extratoModo='geral', extratoCatsAbertas=[], extratoTipo='diario';
function setExtratoModo(m){ extratoModo=m; openExtratoMes(); }
function abrirExtrato(tipo){
  extratoTipo=tipo; voltarExtrato=false;
  if(tipo==='diario'){
    extratoModo='categoria';
    extratoCatsAbertas=[...new Set(extratoItensMes().map(e=>e.categoria||'Outros'))];
  } else { extratoModo='geral'; extratoCatsAbertas=[]; }
  openExtratoMes();
}
// itens do mês, no mesmo formato para Diário, A Receber e A Pagar
function extratoItensMes(){
  if(extratoTipo==='diario') return diarioItemsForMonth(diaSel).map(e=>({id:e.id,nome:e.nome,categoria:e.categoria,data:e.data,hora:e.hora||'',valor:e.valor,status:''}));
  const rec=extratoTipo==='receber';
  const list=rec?S.receber:S.pagar, nk=rec?'cliente':'conta', done=rec?'Recebido':'Pago';
  return list
    .filter(e=>monthIndexFromRef(e.referencia)===curMonth&&yearFromRef(e.referencia)===String(curYear))
    .map(e=>({id:e.id,nome:e[nk],categoria:e.tipo,data:e.venc,hora:'',valor:e.valor,status:e.status===done?'✔ '+done:'Pendente'}));
}

const IN_NOME={receber:'Recebido',pagar:'Pago',diario:'Diário'};
function inExtItens(){
  const out=[], ano=String(curYear);
  S.receber.forEach(e=>{ if(e.status==='Recebido'&&monthIndexFromRef(e.referencia)===curMonth&&yearFromRef(e.referencia)===ano) out.push({o:'receber',nome:e.cliente,cat:e.tipo,data:e.venc,hora:'',valor:e.valor}); });
  S.pagar.forEach(e=>{ if(e.status==='Pago'&&monthIndexFromRef(e.referencia)===curMonth&&yearFromRef(e.referencia)===ano) out.push({o:'pagar',nome:e.conta,cat:e.tipo,data:e.venc,hora:'',valor:e.valor}); });
  diarioItemsForMonth(curYear+'-'+String(curMonth+1).padStart(2,'0')+'-01').forEach(e=>out.push({o:'diario',nome:e.nome,cat:e.categoria,data:e.data,hora:e.hora||'',valor:e.valor}));
  return out.sort((a,b)=>a.data!==b.data?b.data.localeCompare(a.data):(b.hora||'').localeCompare(a.hora||''));
}

function inExtReservas(res){

  return reservaOrdem().filter(k=>reservaExistiaEm(k,ym)&&reservaPctEm(k,ym)>0).map(k=>{
    const v=reservaVis(k), p=reservaPctEm(k,ym);
    return {nome:reservaNome(k),icone:v.icone,hex:RSV_COR_HEX[v.cor]||'#999999',valor:base*p/100};
  });
}
